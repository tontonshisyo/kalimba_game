name: Deploy OTOIRO to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare static site
        run: |
          mkdir -p _site/assets
          cp index.html manifest.webmanifest service-worker.js _site/
          cp -R assets/* _site/assets/
          cp assets/css/public.css _site/public.css
          sed -i 's#</head>#  <link rel="stylesheet" href="public.css">\n</head>#' _site/index.html
          sed -i 's#"./assets/css/style.css",#"./assets/css/style.css",\n  "./public.css",#' _site/service-worker.js
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

